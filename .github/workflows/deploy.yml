name: Refresh models and deploy to GitHub Pages

on:
  push:
    # `master` is this repository's default branch; keep `main` for repos that
    # later rename it. A push made by the sync step below does not re-trigger this
    # workflow — GITHUB_TOKEN pushes never trigger runs — so the deploy always
    # happens in the same run, never in a follow-up one.
    branches: [main, master]
  # The refresh cadence. Commits are driven by changes, not by polls — the sync
  # step commits only when the catalogue's bytes differ — so a shorter interval
  # buys freshness without adding commits. GitHub's scheduler is best effort and
  # deprioritizes frequent crons: 5 minutes is the floor it accepts, and below
  # about 15 the scheduling delay eats most of the gain.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Sync + build share one job to save billed minutes: hosted runners bill per
  # job rounded up to the minute, so the old 3-job chain cost 3 minutes per
  # full run for ~35s of work. The no-op path (scheduled run, catalogue
  # unchanged) stops right after the sync step — before `bun install` — so it
  # stays well under one billed minute. Deploy stays separate: it targets the
  # github-pages environment, and folding it in would put the whole toolchain
  # inside the production environment's protection rules with pages:write.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      built: ${{ steps.sync.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      # No dependencies installed yet on purpose:
      # scripts/sync-models.mjs uses only runtime built-ins.
      - name: Snapshot the gateway catalogue
        id: sync
        run: |
          bun run models:sync
          if [ -z "$(git status --porcelain -- public/data/models.json)" ]; then
            echo "Catalogue unchanged; nothing to commit."
            changed=false
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/data/models.json
            git commit -m 'chore(models): refresh gateway catalogue'
            git push
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          # Pushes and manual runs always build; schedules only when the
          # snapshot actually changed. The commit above already sits in this
          # workspace, so the build below uses it directly — no re-checkout.
          # GITHUB_TOKEN pushes never re-trigger this workflow, so committing
          # mid-job cannot cause a follow-up run.
          if [ "$changed" = "true" ] || [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Scheduled run with no catalogue change; skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.sync.outputs.should_build == 'true'
        run: bun install --frozen-lockfile

      - name: Check types and lint
        if: steps.sync.outputs.should_build == 'true'
        run: |
          bun run typecheck
          bun run lint

      # A project site lives under /<repo>/, so the build has to know the prefix.
      # vite.config.ts reads this exact variable.
      - name: Point the build at the project pages subpath
        if: steps.sync.outputs.should_build == 'true'
        run: echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - name: Build
        if: steps.sync.outputs.should_build == 'true'
        run: bun run build

      - uses: actions/configure-pages@v6
        if: steps.sync.outputs.should_build == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.sync.outputs.should_build == 'true'
        with:
          path: dist
          # Without this the artifact drops dotfiles, so the deployed site would
          # not match `dist` — `.nojekyll` in particular.
          include-hidden-files: true

  deploy:
    needs: build
    # The merged build job succeeds (no-op) on unchanged schedules, so gate on
    # its output — previously the skipped build job skipped this transitively.
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
